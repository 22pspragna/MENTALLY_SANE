<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Tracker | Mentally Sane</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      font-family: 'Segoe UI', sans-serif;
      padding-top: 60px;
    }
    .card {
      backdrop-filter: blur(10px);
      background-color: #ffffffcc;
      border: none;
      border-radius: 15px;
    }
    .mood-btn {
      font-size: 1.5rem;
      margin: 5px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <nav class="navbar navbar-light bg-white fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="PROJECT.html">← Back to Home</a>
    </div>
  </nav>

  <!-- Mood Tracker Content -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 text-center">
        <h2 class="fw-bold mb-4">How are you feeling today?</h2>
        <div class="card p-4">
          <div class="mb-3">
            <button class="btn btn-outline-primary mood-btn">😊 Happy</button>
            <button class="btn btn-outline-success mood-btn">😌 Calm</button>
            <button class="btn btn-outline-warning mood-btn">😐 Okay</button>
            <button class="btn btn-outline-danger mood-btn">😟 Anxious</button>
            <button class="btn btn-outline-dark mood-btn">😢 Sad</button>
          </div>
          <textarea class="form-control mb-3" rows="3" placeholder="Want to write more about your day?"></textarea>
          <button class="btn btn-primary w-100">Save Mood Entry</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center py-4 mt-5 bg-light text-muted">
    &copy; 2025 Mentally Sane. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
