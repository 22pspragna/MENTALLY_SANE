<!-- journaling.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Journaling - Mentally Sane</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: #e6f2ff;
    }
    textarea {
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="text-center mb-4">My Journal</h2>
    <div class="mb-3">
      <textarea id="entry" class="form-control" rows="8" placeholder="Write your thoughts here..."></textarea>
    </div>
    <button onclick="saveEntry()" class="btn btn-primary w-100 mb-3">Save Entry</button>
    <h4>Saved Entries</h4>
    <ul id="entriesList" class="list-group"></ul>
    <a href="PROJECT.html" class="btn btn-link mt-4">← Back to Home</a>
  </div>

  <script>
    const entryInput = document.getElementById("entry");
    const entriesList = document.getElementById("entriesList");

    function saveEntry() {
      const entry = entryInput.value.trim();
      if (entry) {
        const listItem = document.createElement("li");
        listItem.className = "list-group-item";
        listItem.textContent = entry;
        entriesList.prepend(listItem);
        entryInput.value = "";
        saveToLocal();
      }
    }

    function saveToLocal() {
      const entries = [];
      document.querySelectorAll("#entriesList li").forEach(li => entries.push(li.textContent));
      localStorage.setItem("journalEntries", JSON.stringify(entries));
    }

    function loadEntries() {
      const saved = JSON.parse(localStorage.getItem("journalEntries") || "[]");
      saved.forEach(text => {
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = text;
        entriesList.appendChild(li);
      });
    }

    window.onload = loadEntries;
  </script>
</body>
</html>
